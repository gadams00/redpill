[package]
name = "redpill"
version = "0.1.1"
edition = "2021"
resolver = "2"

[dependencies]
esp-idf-svc = { version = "0.53", features = ["std", "alloc"] }
embedded-svc = "0.29"
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
esp32-nimble = "0.13"
toml-cfg = "0.2.0"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

# ESP-IDF 5 moved mDNS out of the core into a managed component. It gives the board its
# redpill.local name; esp-idf-svc's `mdns` module is only compiled when this is present.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }
